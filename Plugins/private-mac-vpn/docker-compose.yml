services:
  private-vpn:
    image: metacubex/mihomo:latest
    container_name: PrivateVPN
    env_file:
      - .env
    command: ["-d", "/root/.config/mihomo"]
    restart: unless-stopped
    logging:
      driver: "none"
    volumes:
      - ./state/mihomo/config.yaml:/root/.config/mihomo/config.yaml:ro
      - ./state/mihomo:/root/.config/mihomo

  private-ss:
    build:
      context: .
    image: schoolvpn-private-socks:local
    container_name: PrivateVPNProxy
    user: "${PUID:-1002}:${PGID:-1002}"
    depends_on:
      - private-vpn
    environment:
      PRIVATE_SOCKS_UPSTREAM_HOST: private-vpn
      PRIVATE_SOCKS_UPSTREAM_PORT: "7890"
    restart: unless-stopped
    logging:
      driver: "none"
    ports:
      - "8600-8699:8600-8699/tcp"
      - "8600-8699:8600-8699/udp"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./state:/app/state
